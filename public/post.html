<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Post · Chalk</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="logo" href="index.html">
          <span class="logo-mark" aria-hidden="true"></span>
          Chalk
        </a>
        <nav class="site-nav" aria-label="Main">
          <a class="nav-link nav-link--extra" href="feed.html">Feed</a>
          <a class="nav-link nav-link--extra" href="rules.html">Rules</a>
          <a class="nav-link" href="login.html">Log in</a>
          <a class="button button--primary button--small" href="signup.html">Start writing</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <a class="back-link" href="feed.html">← Back to the feed</a>
      <div id="post">
        <p class="lead">Loading…</p>
      </div>

      <!-- Shown once the post has loaded. -->
      <section class="comments" id="comments" hidden>
        <h2>Comments</h2>
        <div class="comment-list" id="comment-list"></div>

        <form class="form" id="comment-form" hidden>
          <p class="form-message" role="alert"></p>
          <div class="field">
            <label for="comment-body">Add a comment</label>
            <textarea id="comment-body" name="body" rows="3" maxlength="1000" required></textarea>
            <p class="field-error" data-error-for="body"></p>
          </div>
          <div>
            <button class="button button--primary" type="submit">Comment</button>
          </div>
        </form>

        <p class="comment-login" id="comment-login" hidden><a href="login.html">Log in</a> to join the conversation.</p>
      </section>
    </main>

    <script type="module" src="js/pages/post.js"></script>
  </body>
</html>
