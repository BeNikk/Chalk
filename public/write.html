<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Write · Chalk</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="logo" href="index.html">
          <span class="logo-mark" aria-hidden="true"></span>
          Chalk
        </a>
        <nav class="site-nav" aria-label="Main">
          <a class="nav-link nav-link--extra" href="feed.html">Feed</a>
          <a class="nav-link nav-link--extra" href="rules.html">Rules</a>
          <a class="nav-link" href="login.html">Log in</a>
          <a class="button button--primary button--small" href="signup.html">Start writing</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="page-heading">
        <h1>Write something</h1>
        <p class="lead">It goes up under your handle. Keep it kind: see the <a href="rules.html">rules</a>.</p>
      </div>

      <!-- Hidden until we know you're logged in. -->
      <form class="form" id="write-form" hidden>
        <p class="form-message" role="alert"></p>

        <fieldset class="field">
          <legend>Label</legend>
          <div class="label-choices">
            <label class="label-choice" data-label="rant">
              <input type="radio" name="label" value="rant" required checked />
              #rant
            </label>
            <label class="label-choice" data-label="poetry">
              <input type="radio" name="label" value="poetry" required />
              #poetry
            </label>
            <label class="label-choice" data-label="mess">
              <input type="radio" name="label" value="mess" required />
              #mess
            </label>
            <label class="label-choice" data-label="music">
              <input type="radio" name="label" value="music" required />
              #music
            </label>
            <label class="label-choice" data-label="fixit">
              <input type="radio" name="label" value="fixit" required />
              #fixit
            </label>
          </div>
          <p class="field-error" data-error-for="label"></p>
        </fieldset>

        <div class="field">
          <label for="title">Title <span class="field-hint">(optional)</span></label>
          <input id="title" name="title" type="text" maxlength="120" />
          <p class="field-error" data-error-for="title"></p>
        </div>

        <div class="field">
          <label for="body">Your post</label>
          <textarea id="body" name="body" rows="10" maxlength="5000" required></textarea>
          <p class="field-hint" id="body-count">0 / 5000</p>
          <p class="field-error" data-error-for="body"></p>
        </div>

        <div class="actions">
          <button class="button button--primary" type="submit">Post it</button>
          <a class="button" href="feed.html">Cancel</a>
        </div>
      </form>
    </main>

    <script type="module" src="js/pages/write.js"></script>
  </body>
</html>
